server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/board?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root1234!@}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    time-zone: Asia/Seoul

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.example.board.domain
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

jwt:
  secret: ${JWT_SECRET:cHh5a1JvM1FhT1lqQmJpQ0l6N3l0cWZQNVh2R2R0S1pZQzR4cU1yN1ZVd2p2}
  access-token-expire-ms: ${JWT_ACCESS_EXPIRE_MS:3600000}        # 1시간
  refresh-token-expire-ms: ${JWT_REFRESH_EXPIRE_MS:1209600000}   # 14일

logging:
  level:
    root: INFO
    com.example.board: DEBUG
    org.mybatis: DEBUG
